<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>iTS健康増進ビンゴ</title>

<style>

  border-radius:8px;

}

.free{

  font-weight:bold;
}

.rank{
  margin-top:30px;
  padding:15px;
  background:#f3f3f3;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="cell"><input type="checkbox"> ストレッチ5分</div>
